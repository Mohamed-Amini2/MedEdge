databases:
  - name: mededge-db
    plan: free
    databaseName: mededge

services:
  - type: web
    name: mededge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mededge-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PEPPER_PASSWORD
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_EMAIL
        value: demo@mededge.app
      - key: DEMO_PASSWORD
        value: MedEdge2026
